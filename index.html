<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hendar AI Code</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #172554 0%, #020617 45%, #000 100%);
    color: white;
}

.container {
    width: min(1100px, 94%);
    margin: 40px auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    color: transparent;
}

.header p {
    color: #94a3b8;
}

.panel {
    background: rgba(15, 23, 42, .82);
    border: 1px solid rgba(96, 165, 250, .25);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    backdrop-filter: blur(15px);
}

label {
    display: block;
    margin-bottom: 10px;
    color: #cbd5e1;
    font-weight: bold;
}

textarea {
    width: 100%;
    height: 260px;
    resize: vertical;
    border: 1px solid #334155;
    outline: none;
    border-radius: 14px;
    background: #020617;
    color: #e2e8f0;
    padding: 16px;
    font-size: 14px;
    direction: ltr;
    text-align: left;
}

textarea:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,.12);
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 22px;
    color: white;
    background: linear-gradient(135deg,#0284c7,#4f46e5);
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

button.secondary {
    background: #1e293b;
}

.result {
    margin-top: 25px;
}

.status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.badge {
    background: #064e3b;
    color: #6ee7b7;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
}

pre {
    margin: 0;
    padding: 18px;
    min-height: 180px;
    overflow: auto;
    border-radius: 14px;
    background: #020617;
    border: 1px solid #334155;
    color: #a7f3d0;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 15px;
}

.stat {
    padding: 15px;
    border-radius: 14px;
    background: rgba(30,41,59,.7);
    text-align: center;
}

.stat span {
    display: block;
    color: #64748b;
    font-size: 12px;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 18px;
}

.footer {
    text-align: center;
    color: #64748b;
    margin-top: 25px;
    font-size: 13px;
}

@media(max-width:650px) {
    .header h1 {
        font-size: 28px;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Hendar AI Code</h1>
        <p>واجهة ذكاء اصطناعي لمعالجة الأكواد</p>
    </div>

    <div class="panel">

        <label>أدخل الكود</label>

        <textarea id="inputCode" placeholder="ضع كود Lua هنا...">print("Hello World")</textarea>

        <div class="controls">
            <button onclick="processCode()">⚡ معالجة بالذكاء الاصطناعي</button>
            <button class="secondary" onclick="clearAll()">مسح</button>
            <button class="secondary" onclick="copyOutput()">نسخ الناتج</button>
        </div>

        <div class="result">

            <div class="status">
                <b>الناتج</b>
                <span class="badge" id="status">جاهز</span>
            </div>

            <pre id="output">اضغط على "معالجة بالذكاء الاصطناعي" لعرض النتيجة...</pre>

            <div class="stats">

                <div class="stat">
                    <span>Input Bytes</span>
                    <strong id="inputBytes">0</strong>
                </div>

                <div class="stat">
                    <span>Output Bytes</span>
                    <strong id="outputBytes">0</strong>
                </div>

                <div class="stat">
                    <span>Elapsed</span>
                    <strong id="elapsed">0 ms</strong>
                </div>

            </div>

        </div>

    </div>

    <div class="footer">
        Hendar AI Code • HTML / CSS / JavaScript
    </div>

</div>

<script>

const exampleResponse = {
    ok: true,
    preset: "Medium",
    output: "-- Made By Hendar\nlocal a=...;",
    stats: {
        inputBytes: 22,
        outputBytes: 1843,
        elapsedMs: 412
    }
};

function processCode() {

    const input = document.getElementById("inputCode").value;
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    if (!input.trim()) {
        output.textContent = "الرجاء إدخال كود أولاً.";
        return;
    }

    status.textContent = "جاري المعالجة...";

    const start = performance.now();

    setTimeout(() => {

        const elapsed = Math.round(performance.now() - start);

        /*
          هذه نسخة تجريبية Front-End.
          هنا يتم عرض نموذج JSON الذي أعطيته.
        */

        const result = {
            ok: true,
            preset: "Medium",
            output: exampleResponse.output,
            stats: {
                inputBytes: new Blob([input]).size,
                outputBytes: 1843,
                elapsedMs: elapsed
            }
        };

        output.textContent = result.output;

        document.getElementById("inputBytes").textContent =
            result.stats.inputBytes;

        document.getElementById("outputBytes").textContent =
            result.stats.outputBytes;

        document.getElementById("elapsed").textContent =
            result.stats.elapsedMs + " ms";

        status.textContent = "تمت المعالجة";

    }, 400);
}

function clearAll() {
    document.getElementById("inputCode").value = "";
    document.getElementById("output").textContent =
        "اضغط على \"معالجة بالذكاء الاصطناعي\" لعرض النتيجة...";

    document.getElementById("inputBytes").textContent = "0";
    document.getElementById("outputBytes").textContent = "0";
    document.getElementById("elapsed").textContent = "0 ms";
    document.getElementById("status").textContent = "جاهز";
}

function copyOutput() {

    const text = document.getElementById("output").textContent;

    navigator.clipboard.writeText(text)
        .then(() => {
            document.getElementById("status").textContent = "تم النسخ";

            setTimeout(() => {
                document.getElementById("status").textContent = "جاهز";
            }, 1500);
        });
}

</script>

</body>
</html>
